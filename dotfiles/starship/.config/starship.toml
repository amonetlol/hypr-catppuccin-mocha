"$schema" = 'https://starship.rs/config-schema.json'

scan_timeout = 100

format = """
[](fg:surface0)\
$os\
$username\
${custom.local_spacer}\
$hostname\
[](bg:blue fg:surface0)\
$directory\
[](fg:blue bg:sapphire)\
[](fg:sapphire bg:sky)\
$nodejs\
$php\
$java\
$python\
[](fg:sky bg:sapphire)\
$time\
[ ](fg:sapphire)\
$character"""

palette = 'catppuccin_mocha'

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mavue = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"

[os]
disabled = false
style = "bg:surface0 fg:sapphire"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = ""
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
NixOS = "󱄅"
CachyOS = "󰣇"

[username]
show_always = true
style_user = "bg:surface0 fg:sapphire"
style_root = "bg:surface0 fg:red"
format = '[ $user]($style)'

[custom.local_spacer]
when = 'test -z "$SSH_CONNECTION$SSH_TTY$SSH_CLIENT"'
format = '[ ](bg:surface0 fg:sapphire)'

[hostname]
ssh_only = true
ssh_symbol = "󰢹 "
format = "[@$hostname ](bg:surface0 fg:sapphire)[$ssh_symbol](bg:surface0 fg:sapphire)"

[directory]
style = "fg:base bg:blue"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = " "
"Downloads" = " "
"GitHub" = " "
"Music" = " "
"Pictures" = " "
"Public" = " "
"Templates" = " "
"Videos" = " "

[git_branch]
symbol = ""
style = "bg:sapphire"
format = '[[ $symbol $branch ](fg:base bg:sapphire)]($style)'

[git_status]
style = "bg:sapphire"
format = '[[($all_status$ahead_behind )](fg:base bg:sapphire)]($style)'
up_to_date = '[ ✓](bg:sapphire fg:base)'
untracked = '[?\($count\)](bg:sapphire fg:base)'
stashed = '[\$](bg:sapphire fg:base)'
modified = '[!\($count\)](bg:sapphire fg:base)'
renamed = '[»\($count\)](bg:sapphire fg:base)'
deleted = '[✘\($count\)](bg:sapphire fg:base)'
staged = '[++\($count\)](bg:sapphire fg:base)'
ahead = '[⇡\(${count}\)](bg:sapphire fg:base)'
diverged = '⇕[\[](bg:sapphire fg:base)[⇡\(${ahead_count}\)](bg:sapphire fg:base)[⇣\(${behind_count}\)](bg:sapphire fg:base)[\]](bg:sapphire fg:base)'
behind = '[⇣\(${count}\)](bg:sapphire fg:base)'

[nodejs]
symbol = ""
style = "bg:sky"
format = '[[ $symbol( $version) ](fg:base bg:sky)]($style)'

#[c]
#symbol = " "
#style = "bg:sky"
#format = '[[ $symbol( $version) ](fg:base bg:sky)]($style)'

#[rust]
#symbol = ""
#style = "bg:sky"
#format = '[[ $symbol( $version) ](fg:base bg:sky)]($style)'

#[golang]
#symbol = ""
#style = "bg:sky"
#format = '[[ $symbol( $version) ](fg:base bg:sky)]($style)'

[php]
symbol = ""
style = "bg:sky"
format = '[[ $symbol( $version) ](fg:base bg:sky)]($style)'

[java]
symbol = " "
style = "bg:sky"
format = '[[ $symbol( $version) ](fg:base bg:sky)]($style)'

#[kotlin]
#symbol = ""
#style = "bg:sky"
#format = '[[ $symbol( $version) ](fg:base bg:sky)]($style)'

#[haskell]
#symbol = ""
#style = "bg:sky"
#format = '[[ $symbol( $version) ](fg:base bg:sky)]($style)'

[python]
symbol = ""
style = "bg:sky"
format = '[[ $symbol( $version) ](fg:base bg:sky)]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:sapphire"
format = '[[  $time ](fg:base bg:sapphire)]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[](bold fg:blue)'
error_symbol = '[](bold fg:red)'
vimcmd_symbol = '[](bold fg:blue)'
vimcmd_replace_one_symbol = '[](bold fg:maroon)'
vimcmd_replace_symbol = '[](bold fg:maroon)'
vimcmd_visual_symbol = '[](bold fg:green)'

[profiles]
transient = """
$character\
"""

rtransient = """
"""
